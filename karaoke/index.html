<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karaoke di Capodanno</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Karaoke">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E1A35">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3FA; --surface:#FFFFFF; --ink:#1E1A35; --muted:#6B6585; --line:#E2DEEE;
  --gold:#B07D1A; --plum:#7A2E63; --plum-soft:#F3E3EE; --sel:#FBF4E4; --ok:#1F8A4C;
  --bar:#1E1A35; --bar-ink:#FFFFFF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16132A; --surface:#201C38; --ink:#F2EEFF; --muted:#A7A0C4; --line:#332E52;
    --gold:#E3B656; --plum:#E58BC6; --plum-soft:#3A2440; --sel:#2C2638; --ok:#4CC27F;
    --bar:#F2EEFF; --bar-ink:#16132A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16132A; --surface:#201C38; --ink:#F2EEFF; --muted:#A7A0C4; --line:#332E52;
  --gold:#E3B656; --plum:#E58BC6; --plum-soft:#3A2440; --sel:#2C2638; --ok:#4CC27F;
  --bar:#F2EEFF; --bar-ink:#16132A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 150px}
[hidden]{display:none!important}
.year{font-size:clamp(90px,22vw,170px);line-height:.82;font-weight:800;font-variation-settings:"wdth" 75,"opsz" 96;
  letter-spacing:-.02em;color:transparent;-webkit-text-stroke:2px var(--gold);margin:0 0 8px}
.hero{display:flex;align-items:flex-end;gap:clamp(8px,3vw,24px);margin-bottom:10px}
.hero .year{margin:0 0 4px}
.singer{height:clamp(170px,42vw,300px);width:auto;flex:none}
h1{font-size:clamp(32px,6vw,48px);line-height:1.05;margin:0;font-weight:750}
h2{font-size:clamp(26px,5vw,34px);line-height:1.1;margin:0;font-weight:750}
.intro{color:var(--muted);margin:12px 0 0;max-width:46ch}
input[type=text],input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;width:100%}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{font:inherit;font-weight:700;border-radius:14px;padding:15px 18px;border:0;cursor:pointer;text-align:center}
.primary{background:var(--ink);color:var(--bg)}
.primary:disabled{opacity:.35;cursor:default}
.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.danger{background:transparent;color:var(--plum);border:1.5px solid var(--line)}
.link{font:inherit;font-size:15px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px}

/* start */
#start{padding-top:44px}
.namebox{margin-top:30px;display:grid;gap:12px;max-width:460px}
.namebox label{font-weight:650}
.foot{margin-top:56px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:15px;border-top:1px solid var(--line);padding-top:14px}

/* pick */
.pickhead{padding:26px 0 4px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pickhead p{margin:4px 0 0;color:var(--muted)}
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px}
.tabs button{font:inherit;font-weight:650;border:0;border-radius:10px;padding:10px 6px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tabs small{font-weight:450;opacity:.75;margin-left:5px}
.row2{display:flex;gap:8px;margin-top:10px}
.row2 input{flex:1}
.sort{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 10px}
.count{font-size:14px;color:var(--muted);margin:8px 2px 0}
ul{list-style:none;margin:0;padding:0}
.letter{font-weight:800;font-size:22px;color:var(--gold);padding:18px 4px 4px;font-variation-settings:"wdth" 80}
li.song{border-bottom:1px solid var(--line)}
li.song button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 8px;cursor:pointer;border-radius:10px}
li.song button:focus-visible{outline:3px solid var(--gold)}
li.song.full button{opacity:.45}
.t{font-weight:620;line-height:1.25}
.a{color:var(--muted);font-size:15px;margin-top:2px}
.duo{display:inline-block;font-size:12px;font-weight:650;color:var(--plum);background:var(--plum-soft);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.tick{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--muted)}
li.song.on button{background:var(--sel);opacity:1}
li.song.on .tick{background:var(--gold);border-color:var(--gold);color:#fff}
.empty{color:var(--muted);padding:30px 4px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.barin{max-width:680px;margin:0 auto;background:var(--bar);color:var(--bar-ink);border-radius:18px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(20,16,40,.28)}
.chosen{flex:1;min-width:0;font-size:15px}
.chosen b{display:block;font-size:16px}
.chosen span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.barin .btn{background:var(--gold);color:#fff;padding:13px 18px}
.barin .btn:disabled{opacity:.4}

/* done */
#done{padding-top:70px;text-align:left}
#done ol{margin:20px 0 30px;padding-left:24px;font-size:20px}
#done li{margin:6px 0}

/* regia */
#regia{padding-top:26px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.view{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px;margin:18px 0 6px}
.view button{font:inherit;font-weight:650;border:0;border-radius:10px;padding:10px 6px;background:transparent;color:var(--muted);cursor:pointer}
.view button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.hint{color:var(--muted);font-size:15px;margin:6px 2px 14px}
.person{border-bottom:1px solid var(--line);padding:14px 2px}
.person h3{margin:0 0 6px;font-size:22px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.person h3 button{font:inherit;font-size:14px;font-weight:500;color:var(--plum);background:none;border:0;cursor:pointer;padding:4px}
.req{display:flex;gap:12px;align-items:center;padding:7px 0}
.req input{width:24px;height:24px;accent-color:var(--ok);flex:none}
.req.done .t,.req.done .a{text-decoration:line-through;opacity:.5}
.round{font-weight:800;color:var(--gold);font-size:20px;margin:20px 0 4px}
.who{font-weight:700;color:var(--plum)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.browsebox{margin-top:34px;max-width:460px;display:grid;gap:10px}
.browsebox p{margin:0;color:var(--muted)}
.browsing li.song .tick{display:none}
.browsing li.song button{cursor:default}
.armed{background:var(--plum)!important;color:#fff!important;border-color:var(--plum)!important;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const MAX = 3, CHUNK = 120;
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let requests = store.get("karaoke-requests", []);
const save = () => store.set("karaoke-requests", requests);
const $ = id => document.getElementById(id);
const norm = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’`]/g,"'");
const sortKey = t => norm(t).replace(/^(the|il|lo|la|i|gli|le|l')\s*/,"").replace(/^[^a-z0-9]+/,"");
const byId = new Map();
for (const k of ["it","fo"]) DATA[k].forEach(s=>{ s.push(norm(s[1]+" "+s[2])); byId.set(s[0],s); });
$("c-it").textContent = DATA.it.length; $("c-fo").textContent = DATA.fo.length;

function show(id){ ["start","pick","done","regia"].forEach(s=>$(s).hidden = s!==id); window.scrollTo(0,0); }

/* ---- start ---- */
function summary(){
  const n = requests.length, c = requests.reduce((a,r)=>a+r.songs.length,0);
  $("summary").textContent = n ? n+(n===1?" persona":" persone")+", "+c+(c===1?" canzone richiesta":" canzoni richieste") : "Ancora nessuna richiesta";
}
$("who").addEventListener("input",()=>{ $("go").disabled = !$("who").value.trim(); });
let name = "", sel = [], browsing = false;
$("nameform").addEventListener("submit",e=>{
  e.preventDefault(); name = $("who").value.trim(); if(!name) return;
  browsing=false; $("pick").classList.remove("browsing"); $("bar").hidden=false;
  $("pickhint").textContent="Tocca da una a tre canzoni."; $("cancel").textContent="Annulla";
  sel = []; $("hi").textContent = "Ciao "+name; $("q").value=""; query="";
  show("pick"); compute(); updateBar();
});
$("cancel").onclick = ()=>{ resetStart(); };
$("browse").onclick = ()=>{
  browsing=true; sel=[]; $("pick").classList.add("browsing"); $("bar").hidden=true;
  $("hi").textContent="Tutte le canzoni";
  $("pickhint").textContent="Qui puoi solo guardare. Per sceglierle torna all’inizio e scrivi il tuo nome.";

};
function confirmTap(btn,label,action){
  if(btn.dataset.armed){ delete btn.dataset.armed; btn.textContent=btn.dataset.label; btn.classList.remove("armed"); action(); return; }
  btn.dataset.armed="1"; btn.dataset.label=btn.textContent; btn.textContent=label; btn.classList.add("armed");
  setTimeout(()=>{ if(btn.dataset.armed){ delete btn.dataset.armed; btn.textContent=btn.dataset.label; btn.classList.remove("armed"); } },4000);
}
function resetStart(){ $("who").value=""; $("go").disabled=true; summary(); show("start"); }

/* ---- pick ---- */
let tab="it", sort="pop", query="", current=[], shown=0, lastLetter=null;
function compute(){
  let arr = DATA[tab];
  if(query){ const w = norm(query).split(/\s+/).filter(Boolean); arr = arr.filter(s=>w.every(x=>s[5].includes(x))); }
  else arr = arr.slice();
  if(sort==="artist") arr.sort((a,b)=>sortKey(a[2]).localeCompare(sortKey(b[2]))||sortKey(a[1]).localeCompare(sortKey(b[1])));
  if(sort==="title") arr.sort((a,b)=>sortKey(a[1]).localeCompare(sortKey(b[1])));
  current=arr; shown=0; lastLetter=null; $("list").innerHTML="";
  $("count").textContent = arr.length ? arr.length+(arr.length===1?" canzone":" canzoni") : "";
  if(!arr.length){ const li=document.createElement("li"); li.className="empty"; li.textContent="Nessuna canzone trovata. Prova con il nome del cantante o con un’altra parola del titolo."; $("list").appendChild(li); return; }
  more();
}
function more(){
  const f=document.createDocumentFragment(), end=Math.min(shown+CHUNK,current.length);
  for(let i=shown;i<end;i++){
    const s=current[i];
    if(sort!=="pop" && !query){
      const c=(sortKey(sort==="artist"?s[2]:s[1])[0]||"#").toUpperCase(), L=/[A-Z]/.test(c)?c:"#";
      if(L!==lastLetter){ const h=document.createElement("li"); h.className="letter"; h.setAttribute("aria-hidden","true"); h.textContent=L; f.appendChild(h); lastLetter=L; }
    }
    f.appendChild(row(s));
  }
  shown=end; $("list").appendChild(f);
}
function row(s){
  const li=document.createElement("li"); li.className="song"; li.dataset.id=s[0];
  const b=document.createElement("button");
  const d=document.createElement("div");
  const t=document.createElement("div"); t.className="t"; t.textContent=s[1];
  if(s[4]){ const x=document.createElement("span"); x.className="duo"; x.textContent="duetto"; t.appendChild(x); }
  const a=document.createElement("div"); a.className="a"; a.textContent=s[2]+(s[3]?", "+s[3]:"");
  d.append(t,a);
  const k=document.createElement("span"); k.className="tick"; k.setAttribute("aria-hidden","true");
  b.append(d,k); b.onclick=()=>toggle(s[0]);
  li.appendChild(b); paint(li); return li;
}
function paint(li){
  const id=+li.dataset.id, on=sel.includes(id), full=!on && sel.length>=MAX;
  li.classList.toggle("on",on); li.classList.toggle("full",full);
  const b=li.querySelector("button"); b.setAttribute("aria-pressed",on); b.setAttribute("aria-disabled",full);
  li.querySelector(".tick").textContent = on ? (sel.indexOf(id)+1) : "+";
}
function toggle(id){
  if(browsing) return;
  const i=sel.indexOf(id);
  if(i>=0) sel.splice(i,1); else if(sel.length<MAX) sel.push(id); else return;
  document.querySelectorAll("li.song").forEach(paint); updateBar();
}
function updateBar(){
  const n=sel.length;
  $("chosen").innerHTML="";
  const b=document.createElement("b"); b.textContent = n ? n+" di "+MAX+" scelte" : "Nessuna canzone scelta";
  const sp=document.createElement("span"); sp.textContent = n ? sel.map(id=>byId.get(id)[1]).join(", ") : "Puoi sceglierne fino a tre";
  $("chosen").append(b,sp);
  $("finish").disabled = !n;
}
new IntersectionObserver(es=>{ if(es[0].isIntersecting && shown<current.length) more(); },{rootMargin:"600px"}).observe($("sentinel"));
function setTab(t){ tab=t; $("tab-it").setAttribute("aria-pressed",t==="it"); $("tab-fo").setAttribute("aria-pressed",t==="fo"); compute(); }
$("tab-it").onclick=()=>setTab("it"); $("tab-fo").onclick=()=>setTab("fo");
let qt; $("q").addEventListener("input",e=>{ clearTimeout(qt); qt=setTimeout(()=>{ query=e.target.value.trim(); compute(); },150); });
$("sort").addEventListener("change",e=>{ sort=e.target.value; compute(); });

$("finish").onclick=()=>{
  if(!sel.length) return;
  requests.push({id:Date.now(), name, songs:sel.slice(), done:[]}); save();
  $("thanks").textContent = "Grazie "+name+", sei in lista";
  $("donelist").innerHTML="";
  sel.forEach(id=>{ const s=byId.get(id), li=document.createElement("li"); li.textContent=s[1]+" – "+s[2]; $("donelist").appendChild(li); });
  show("done");
};
$("next").onclick=resetStart;

/* ---- regia ---- */
let view="person";
$("to-regia").onclick=()=>{ renderRegia(); show("regia"); };
$("back").onclick=resetStart;
$("v-person").onclick=()=>{ view="person"; renderRegia(); };
$("v-round").onclick=()=>{ view="round"; renderRegia(); };
function songLine(r,id,withName){
  const s=byId.get(id), lab=document.createElement("label"); lab.className="req"+(r.done.includes(id)?" done":"");
  const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=r.done.includes(id);
  cb.setAttribute("aria-label","Segna come cantata");
  cb.onchange=()=>{ r.done = cb.checked ? [...r.done,id] : r.done.filter(x=>x!==id); save(); renderRegia(); };
  const d=document.createElement("div");
  const t=document.createElement("div"); t.className="t";
  if(withName){ const w=document.createElement("span"); w.className="who"; w.textContent=r.name+": "; t.appendChild(w); }
  t.appendChild(document.createTextNode(s?s[1]:"Brano non trovato"));
  const a=document.createElement("div"); a.className="a"; a.textContent=s?s[2]:"";
  d.append(t,a); lab.append(cb,d); return lab;
}
function renderRegia(){
  $("v-person").setAttribute("aria-pressed",view==="person"); $("v-round").setAttribute("aria-pressed",view==="round");
  const box=$("rlist"); box.innerHTML="";
  if(!requests.length){ const p=document.createElement("p"); p.className="empty"; p.textContent="Ancora nessuna richiesta. Torna alla scelta e passa l’iPad agli ospiti."; box.appendChild(p); $("vhint").textContent=""; return; }
  if(view==="person"){
    $("vhint").textContent="Ogni persona con le sue canzoni, nell’ordine in cui ha scelto.";
    requests.forEach(r=>{
      const div=document.createElement("div"); div.className="person";
      const h=document.createElement("h3"); h.textContent=r.name;
      const del=document.createElement("button"); del.textContent="Elimina";
      del.onclick=()=>confirmTap(del,"Tocca ancora per eliminare",()=>{ requests=requests.filter(x=>x!==r); save(); renderRegia(); });
      h.appendChild(del); div.appendChild(h);
      r.songs.forEach(id=>div.appendChild(songLine(r,id,false)));
      box.appendChild(div);
    });
  } else {
    $("vhint").textContent="Prima canzone di tutti, poi la seconda, poi la terza: così canta ognuno a turno.";
    const max=Math.max(...requests.map(r=>r.songs.length));
    for(let g=0; g<max; g++){
      const h=document.createElement("div"); h.className="round"; h.textContent=(g+1)+"° giro"; box.appendChild(h);
      requests.forEach(r=>{ if(r.songs[g]!==undefined) box.appendChild(songLine(r,r.songs[g],true)); });
    }
  }
}
$("wipe").onclick=()=>confirmTap($("wipe"),"Tocca ancora per cancellare tutto",()=>{ requests=[]; save(); renderRegia(); });

summary();
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch(e) {} }
</script>
