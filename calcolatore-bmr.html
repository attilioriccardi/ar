<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore BMR Avanzato</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a2e;
            --accent: #e8c547;
            --accent2: #2ecc71;
            --bg: #f5f2eb;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-light: #7a7a8c;
            --border: #e2ddd4;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 20% 50%, rgba(232, 197, 71, 0.08) 0%, transparent 50%),
                              radial-gradient(circle at 80% 20%, rgba(46, 204, 113, 0.06) 0%, transparent 40%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .header {
            margin-bottom: 32px;
        }

        .header-label {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 2.2rem;
            line-height: 1.15;
            color: var(--text);
            font-weight: 400;
        }

        h1 span {
            color: var(--accent);
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 32px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 24px rgba(26, 26, 46, 0.06);
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-light);
            letter-spacing: 0.01em;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            color: var(--text);
            background-color: #fafaf8;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        select {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%237a7a8c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 44px;
            cursor: pointer;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(232, 197, 71, 0.15);
        }

        input[type="number"]::placeholder {
            color: #c0bdb5;
        }

        .divider {
            border: none;
            border-top: 1.5px dashed var(--border);
            margin: 24px 0;
        }

        /* Toggle metodo */
        .metodo-toggle {
            display: flex;
            background: #f0ede6;
            border-radius: 10px;
            padding: 4px;
            gap: 4px;
        }

        .metodo-toggle input[type="radio"] {
            display: none;
        }

        .metodo-toggle label {
            flex: 1;
            text-align: center;
            padding: 9px 8px;
            border-radius: 7px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
            margin: 0;
        }

        .metodo-toggle input[type="radio"]:checked + label {
            background: var(--card-bg);
            color: var(--text);
            box-shadow: 0 1px 6px rgba(26,26,46,0.08);
        }

        .section-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 16px;
        }

        /* Campo massa grassa nascosto inizialmente */
        #fatSection {
            display: none;
        }

        #standardSection {
            display: block;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* Pulsante calcola */
        button[type="submit"] {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 8px;
            letter-spacing: 0.02em;
        }

        button[type="submit"]:hover {
            background-color: #2a2a4a;
        }

        button[type="submit"]:active {
            transform: scale(0.99);
        }

        /* Risultati */
        .results {
            margin-top: 20px;
            display: none;
            gap: 12px;
            flex-direction: column;
        }

        .results.visible {
            display: flex;
        }

        .result-box {
            padding: 20px 24px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-box.bmr {
            background: var(--primary);
            color: white;
        }

        .result-box.tdee {
            background: linear-gradient(135deg, #1a3a2a, #1f4d35);
            color: white;
        }

        .result-label {
            font-size: 0.78rem;
            font-weight: 500;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 4px;
        }

        .result-formula {
            font-size: 0.72rem;
            opacity: 0.5;
            margin-top: 2px;
        }

        .result-value {
            font-family: 'DM Serif Display', serif;
            font-size: 2rem;
            font-weight: 400;
            white-space: nowrap;
            margin-left: 16px;
        }

        .result-value span {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        /* Info tag */
        .info-tag {
            background: rgba(232, 197, 71, 0.12);
            border: 1px solid rgba(232, 197, 71, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.8rem;
            color: #7a6a1a;
            margin-top: 12px;
            line-height: 1.5;
        }

        /* Animazione risultati */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            animation: slideUp 0.3s ease both;
        }

        .result-box:nth-child(2) {
            animation-delay: 0.08s;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <p class="header-label">Strumento nutrizionale</p>
        <h1>Calcola il tuo <span>BMR</span></h1>
    </div>

    <div class="card">
        <form id="bmrForm">

            <!-- Peso -->
            <div class="form-group">
                <label for="weight">Peso attuale (kg)</label>
                <input type="number" id="weight" step="0.1" min="30" max="250" placeholder="Es. 65" required>
            </div>

            <hr class="divider">

            <!-- Selezione metodo -->
            <div class="form-group">
                <p class="section-label">Metodo di calcolo</p>
                <div class="metodo-toggle">
                    <input type="radio" name="metodo" id="metodo-standard" value="no" checked>
                    <label for="metodo-standard">Dati standard</label>
                    <input type="radio" name="metodo" id="metodo-avanzato" value="yes">
                    <label for="metodo-avanzato">Ho la % massa grassa</label>
                </div>
            </div>

            <!-- Sezione massa grassa (Katch-McArdle) -->
            <div id="fatSection">
                <div class="form-group">
                    <label for="fatPercent">Percentuale massa grassa (%)</label>
                    <input type="number" id="fatPercent" step="0.1" min="3" max="60" placeholder="Es. 19.1">
                </div>
            </div>

            <!-- Sezione standard (Mifflin-St. Jeor) -->
            <div id="standardSection">
                <div class="form-group">
                    <label for="gender">Sesso biologico</label>
                    <select id="gender">
                        <option value="male" selected>Uomo</option>
                        <option value="female">Donna</option>
                    </select>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="age">Età (anni)</label>
                        <input type="number" id="age" min="15" max="100" placeholder="Es. 34">
                    </div>
                    <div class="form-group">
                        <label for="height">Altezza (cm)</label>
                        <input type="number" id="height" min="100" max="250" placeholder="Es. 175">
                    </div>
                </div>
            </div>

            <hr class="divider">

            <!-- Attività fisica -->
            <div class="form-group">
                <label for="activity">Livello di attività fisica</label>
                <select id="activity">
                    <option value="1.2">Sedentario (ufficio, pochissimo sport)</option>
                    <option value="1.375" selected>Leggera (sport 1–3 gg/settimana)</option>
                    <option value="1.55">Moderata (sport 3–5 gg/settimana)</option>
                    <option value="1.725">Intensa (lavoro pesante o sport quotidiano)</option>
                </select>
            </div>

            <button type="submit">Calcola le calorie →</button>
        </form>

        <!-- Risultati -->
        <div class="results" id="resultsSection">
            <div class="result-box bmr">
                <div>
                    <p class="result-label">Metabolismo Basale</p>
                    <p class="result-formula" id="formulaType">—</p>
                </div>
                <p class="result-value" id="bmrValue">— <span>kcal</span></p>
            </div>
            <div class="result-box tdee">
                <div>
                    <p class="result-label">Fabbisogno Giornaliero</p>
                    <p class="result-formula">TDEE</p>
                </div>
                <p class="result-value" id="tdeeValue">— <span>kcal</span></p>
            </div>
            <div class="info-tag" id="infoTag"></div>
        </div>
    </div>
</div>

<script>
    const fatSection      = document.getElementById('fatSection');
    const standardSection = document.getElementById('standardSection');
    const fatInput        = document.getElementById('fatPercent');

    // Imposto stato iniziale esplicito via JS (fix cross-browser)
    fatSection.style.display      = 'none';
    standardSection.style.display = 'block';

    // Cambio metodo con i radio button
    document.querySelectorAll('input[name="metodo"]').forEach(function(radio) {
        radio.addEventListener('change', function() {
            if (this.value === 'yes') {
                fatSection.style.display      = 'block';
                standardSection.style.display = 'none';
                fatInput.required = true;
            } else {
                fatSection.style.display      = 'none';
                standardSection.style.display = 'block';
                fatInput.required = false;
                fatInput.value    = '';
            }
        });
    });

    document.getElementById('bmrForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const weight             = parseFloat(document.getElementById('weight').value);
        const metodo             = document.querySelector('input[name="metodo"]:checked').value;
        const activityMultiplier = parseFloat(document.getElementById('activity').value);

        let bmr = 0;
        let formulaUsata = '';
        let infoText = '';

        if (metodo === 'yes') {
            // Katch-McArdle
            const fatPercent = parseFloat(fatInput.value);
            if (isNaN(fatPercent) || fatPercent <= 0) {
                alert('Inserisci una percentuale di massa grassa valida.');
                return;
            }
            const leanMass = weight * (1 - (fatPercent / 100));
            bmr = 370 + (21.6 * leanMass);
            formulaUsata = 'Formula Katch-McArdle';
            infoText = 'Calcolo basato sulla massa magra reale: più preciso rispetto alla stima standard.';
        } else {
            // Mifflin-St. Jeor
            const gender = document.getElementById('gender').value;
            const age    = parseInt(document.getElementById('age').value);
            const height = parseInt(document.getElementById('height').value);

            if (isNaN(age) || isNaN(height)) {
                alert('Inserisci età e altezza per procedere.');
                return;
            }

            if (gender === 'male') {
                bmr = (10 * weight) + (6.25 * height) - (5 * age) + 5;
            } else {
                bmr = (10 * weight) + (6.25 * height) - (5 * age) - 161;
            }
            formulaUsata = 'Formula Mifflin-St. Jeor';
            infoText = 'Stima standard. Per maggiore precisione, usa la % di massa grassa dalla tua bilancia.';
        }

        const tdee = bmr * activityMultiplier;

        document.getElementById('formulaType').textContent = formulaUsata;
        document.getElementById('bmrValue').innerHTML  = Math.round(bmr)  + ' <span>kcal</span>';
        document.getElementById('tdeeValue').innerHTML = Math.round(tdee) + ' <span>kcal</span>';
        document.getElementById('infoTag').textContent = infoText;

        const results = document.getElementById('resultsSection');
        results.classList.add('visible');
        results.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
</script>

</body>
</html>
